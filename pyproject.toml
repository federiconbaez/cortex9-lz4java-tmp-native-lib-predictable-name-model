[project]
name = "cortex9-lz4java-tmp-native-lib-predictable-name-model"
version = "0.1.0"
description = "Offline, inert model of the lz4-java predictable temporary native library name (CVE-2026-106451)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF"]
# SIM905, SIM110: derive_expected.py keeps a deliberately different style (independent derivation)
ignore = ["SIM905", "SIM110"]
